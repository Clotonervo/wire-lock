<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wire Lock</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
      #status { position: fixed; top: 12px; left: 12px; pointer-events: none; }
      #crosshair {
        position: fixed; top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
        background: #fff; border-radius: 50%; box-shadow: 0 0 0 1px #0008; pointer-events: none;
      }
      #lock-prompt {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; background: #000a; cursor: pointer; text-align: center;
      }
      #lock-prompt[hidden] { display: none; }
      #lock-prompt h1 { margin: 0; font-size: 28px; letter-spacing: 0.04em; }
      #lock-prompt p { margin: 0; opacity: 0.8; }
      #crosshair[hidden] { display: none; }
      #crosshair.hit { background: transparent; box-shadow: none; }
      #crosshair.hit::before, #crosshair.hit::after {
        content: ""; position: absolute; left: -5px; top: 1px; width: 14px; height: 2px; background: #fff;
      }
      #crosshair.hit::before { transform: rotate(45deg); }
      #crosshair.hit::after { transform: rotate(-45deg); }
      #crosshair.kill::before, #crosshair.kill::after { background: #ff4040; }
      #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px #000c; }
      .hud-top { position: absolute; top: 10px; left: 0; right: 0; text-align: center; }
      .hud-round { font-size: 22px; font-weight: 700; }
      .hud-round-sub { font-size: 13px; opacity: 0.85; }
      .hud-banner { margin-top: 14px; opacity: 0; transform: translateY(-6px); transition: opacity 0.3s, transform 0.3s; }
      .hud-banner.show { opacity: 1; transform: none; animation: banner-pulse 0.5s ease-in-out 3; }
      .hud-banner-title { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; color: #ffc94d; text-shadow: 0 2px 6px #000a; }
      .hud-banner-sub { font-size: 14px; opacity: 0.95; text-shadow: 0 1px 4px #000c; }
      @keyframes banner-pulse { 50% { transform: scale(1.06); } }
      .hud-feed { position: absolute; top: 36px; left: 12px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
      .hud-feed li { margin-bottom: 3px; padding: 2px 6px; background: #0006; border-radius: 3px; width: fit-content; }
      .hud-feed li.mine { background: #7a5a0099; }
      .hud-feed .weapon { opacity: 0.75; }
      .hud-middle { position: absolute; top: 58%; left: 0; right: 0; text-align: center; }
      .hud-center { font-size: 26px; font-weight: 700; }
      .hud-center-sub { font-size: 15px; opacity: 0.9; }
      .hud-health { position: absolute; left: 20px; bottom: 16px; font-size: 40px; font-weight: 800; }
      .hud-health:not(:empty)::after { content: " HP"; font-size: 16px; font-weight: 600; opacity: 0.8; }
      .hud-health.low { color: #ff5a5a; }
      .hud-lives { position: absolute; left: 22px; bottom: 66px; font-size: 22px; color: #ff5a6e; letter-spacing: 3px; }
      .hud-slots { position: absolute; right: 20px; bottom: 72px; display: flex; gap: 10px; font-size: 13px; }
      .hud-slots .slot { opacity: 0.55; }
      .hud-slots .slot.active { opacity: 1; color: #ffd24a; font-weight: 700; }
      .hud-weapon { position: absolute; right: 20px; bottom: 16px; text-align: right; }
      .hud-weapon-name { font-size: 14px; font-weight: 600; opacity: 0.85; }
      .hud-ammo { font-size: 28px; font-weight: 800; }
      .hud-damage { position: absolute; inset: 0; box-shadow: inset 0 0 120px 30px #ff000000; transition: box-shadow 0.3s; }
      .hud-damage.on { box-shadow: inset 0 0 120px 30px #ff0000aa; transition: none; }
      .hud-damage.burning { box-shadow: inset 0 0 140px 40px #ff6a0099; }
      .hud-tracked { position: absolute; inset: 0; box-shadow: inset 0 0 160px 30px #3fd8ff00; transition: box-shadow 0.4s; }
      .hud-tracked.on { box-shadow: inset 0 0 160px 30px #3fd8ff40; animation: tracked-pulse 1.6s ease-in-out infinite; }
      @keyframes tracked-pulse {
        0%, 100% { box-shadow: inset 0 0 160px 30px #3fd8ff30; }
        50% { box-shadow: inset 0 0 170px 40px #3fd8ff60; }
      }
      .scoreboard {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 320px; max-width: calc(100vw - 32px);
        padding: 14px 18px; background: #000c; border-radius: 6px; pointer-events: none;
      }
      .scoreboard[hidden] { display: none; }
      .scoreboard h2 { margin: 0 0 8px; font-size: 18px; text-align: center; }
      .scoreboard table { width: 100%; border-collapse: collapse; }
      .scoreboard td { padding: 3px 8px; }
      .scoreboard thead td { opacity: 0.6; font-size: 12px; }
      .scoreboard td:nth-child(2), .scoreboard td:nth-child(3) { text-align: right; }
      .scoreboard td:nth-child(4) { opacity: 0.6; font-size: 12px; }
      .scoreboard tr.me { color: #ffd24a; }
      #lobby {
        position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: radial-gradient(circle at 50% 30%, #243447, #0d1117);
      }
      #lobby[hidden] { display: none; }
      .lobby-panel {
        width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px;
        padding: 24px; background: #0008; border-radius: 10px; text-align: center;
      }
      .lobby-panel h1 { margin: 0 0 4px; font-size: 32px; letter-spacing: 0.06em; }
      .lobby-panel h2 { margin: 0; font-size: 18px; font-weight: 600; }
      .lobby-panel label { display: flex; flex-direction: column; gap: 4px; text-align: left; font-size: 13px; opacity: 0.9; }
      .lobby-panel input, .lobby-panel select, .lobby-panel button {
        font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 6px; border: 1px solid #ffffff30;
        background: #ffffff12; color: inherit; min-width: 0;
      }
      .lobby-panel select option { color: #111; }
      .lobby-panel button { cursor: pointer; font-weight: 700; white-space: nowrap; }
      .lobby-panel button.primary { background: #ffd24a; color: #111; border-color: #ffd24a; }
      .lobby-panel button:disabled { opacity: 0.5; cursor: default; }
      .lobby-row { display: flex; gap: 8px; }
      .lobby-row > select { flex: 1; }
      .lobby-row > input { flex: 1; }
      .lobby-code { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; }
      .lobby-or, .lobby-note { margin: 0; font-size: 13px; opacity: 0.7; }
      .lobby-error { margin: 0; min-height: 1.2em; color: #ff7a7a; font-size: 14px; }
      .settings-panel {
        margin-top: 14px; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px));
        padding: 12px 14px; background: #0009; border-radius: 8px; cursor: default; font-size: 14px;
      }
      .settings-panel label { display: grid; grid-template-columns: 1fr 1.2fr 3.5em; align-items: center; gap: 10px; text-align: left; }
      .settings-panel input[type="range"] { width: 100%; accent-color: #ffd24a; }
      .settings-panel output { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.9; }
      .room-info { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 15px; }
      #room-code { font-weight: 800; letter-spacing: 0.2em; }
      #copy-invite { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 5px; border: 1px solid #ffffff50; background: #ffffff18; color: inherit; cursor: pointer; }
      .hud-rewires {
        position: absolute; left: 20px; bottom: 96px; max-width: 45vw; font-size: 13px; color: #7fd3ff; opacity: 0.9;
      }
      .hud-feed li.note { background: #1d4e6b99; }
      .rewire-picker {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -42%); z-index: 5;
        width: min(760px, calc(100vw - 32px)); text-align: center; text-shadow: 0 1px 2px #000c;
        padding: 18px; background: #05080ef2; border-radius: 14px; box-shadow: 0 10px 40px #000a;
      }
      .rewire-picker[hidden] { display: none; }
      .rewire-picker h2 { margin: 0 0 12px; font-size: 24px; }
      .rewire-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .rewire-card {
        position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 12px; text-align: left;
        font: inherit; color: inherit; background: #0b1220e6; border: 2px solid #ffffff30; border-radius: 10px; cursor: pointer;
      }
      .rewire-card strong { font-size: 18px; }
      .rewire-card p { margin: 0; font-size: 14px; opacity: 0.9; }
      .rewire-card em { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.75; }
      .rewire-card.rarity-common { border-color: #9aa3ad; }
      .rewire-card.rarity-rare { border-color: #4aa8ff; }
      .rewire-card.rarity-rare em { color: #4aa8ff; }
      .rewire-card.rarity-wild { border-color: #d36bff; box-shadow: 0 0 18px #d36bff55; }
      .rewire-card.rarity-wild em { color: #d36bff; }
      .rewire-card:hover, .rewire-card.chosen { background: #1b2a44f0; }
      .rewire-card.chosen { outline: 3px solid #ffd24a; }
      .rewire-key {
        position: absolute; top: 8px; right: 10px; font-size: 13px; font-weight: 800; padding: 1px 7px;
        border-radius: 4px; background: #ffffff22;
      }
      .rewire-hint { margin: 10px 0 0; font-size: 13px; opacity: 0.8; }
      .debug-overlay {
        position: fixed; top: 8px; right: 8px; margin: 0; padding: 8px 10px;
        background: #000b; color: #9f9; font: 12px/1.4 ui-monospace, Consolas, monospace; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="lock-prompt" hidden>
      <h1>Click to play</h1>
      <p>WASD move · Space jump · Mouse look · Click shoot · 1–4 / wheel weapons · R reload</p>
      <p>Tab scores · M mute · F3 debug · Esc release</p>
      <div class="room-info">Room <span id="room-code"></span> <button id="copy-invite" type="button">Copy invite link</button></div>
    </div>
    <div id="lobby" hidden></div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
